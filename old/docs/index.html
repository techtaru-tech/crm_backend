<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=https://docs.themesic.com/docs/leadhub-saas/">
<title>LeadHub Documentation</title>
<link rel="canonical" href="https://docs.themesic.com/docs/leadhub-saas/">
<meta name="robots" content="noindex">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:#fafafa;color:#0f172a}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .card{
    max-width:480px;text-align:center;
    background:#ffffff;border:1px solid #e0e7ff;border-radius:14px;
    padding:32px 28px;box-shadow:0 8px 24px -8px rgba(15,23,42,.10);
  }
  .logo{
    width:48px;height:48px;border-radius:12px;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
    display:grid;place-items:center;margin:0 auto 18px;
    box-shadow:0 6px 18px -4px rgba(139,92,246,.45);
  }
  .logo svg{width:30px;height:30px;color:#fff}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  p{font-size:14px;color:#475569;line-height:1.55;margin-bottom:20px}
  a.btn{
    display:inline-block;padding:11px 20px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;text-decoration:none;font-weight:700;font-size:14px;
    border-radius:9px;letter-spacing:.01em;
    box-shadow:0 4px 12px -2px rgba(79,70,229,.30);
  }
  .url{
    margin-top:16px;font-size:12px;color:#64748b;
    font-family:'SF Mono','Fira Code',monospace;word-break:break-all;
  }
</style>
<script>
  // JS fallback in case meta refresh is disabled by the browser.
  setTimeout(function(){
    window.location.replace("https://docs.themesic.com/docs/leadhub-saas/");
  }, 50);
</script>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 16h6v24h14v6H22z" fill="currentColor"/>
        <circle cx="44" cy="22" r="4" fill="currentColor" opacity="0.9"/>
      </svg>
    </div>
    <h1>LeadHub Documentation</h1>
    <p>Redirecting you to the online documentation...<br>If your browser doesn't redirect automatically, click the button below.</p>
    <a class="btn" href="https://docs.themesic.com/docs/leadhub-saas/">Open Documentation</a>
    <div class="url">https://docs.themesic.com/docs/leadhub-saas/</div>
  </div>
</body>
</html>
