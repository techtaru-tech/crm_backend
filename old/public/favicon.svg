<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- Funnel / pipeline icon — three converging lines into an arrow -->
  <g fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top wide intake -->
    <path d="M136 148 h240"/>
    <!-- Middle narrowing -->
    <path d="M168 220 h176"/>
    <!-- Bottom narrow -->
    <path d="M208 292 h96"/>
    <!-- Connecting funnel lines left -->
    <line x1="136" y1="148" x2="208" y2="292"/>
    <!-- Connecting funnel lines right -->
    <line x1="376" y1="148" x2="304" y2="292"/>
    <!-- Arrow pointing down from funnel -->
    <line x1="256" y1="292" x2="256" y2="380"/>
    <polyline points="224,352 256,384 288,352"/>
  </g>
  <!-- Small dot at bottom — the "lead" -->
  <circle cx="256" cy="396" r="6" fill="#fff" opacity="0"/>
</svg>
